spring:
  application:
    name: delivery-lab
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:APP}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: ${DB_MIGRATE:false}
    clean-disabled: true
    validate-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
lab:
  environment: ${APP_ENV:DEV}
  release: ${RELEASE_ID:working-tree}
