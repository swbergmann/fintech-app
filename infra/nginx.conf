server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;

    location /api/ { proxy_pass http://${BACKEND_UPSTREAM}; }
    location = /api/health { proxy_pass http://${BACKEND_UPSTREAM}/actuator/health; }
    location = /release.json { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
