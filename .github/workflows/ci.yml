name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Semgrep inspects source code before application tests or compilation.
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install semgrep==1.177.0
      - name: Scan React and Java with Semgrep
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/javascript --config p/react --config p/java \
            --error --strict --metrics=off \
            frontend/src backend/src
      - name: Test AWS image preparation and frontend configuration
        run: python3 -m unittest discover -s tests -p test_aws_images.py -v
      - name: Test release publication safeguards
        run: python3 -m unittest discover -s tests -p test_aws_release.py -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Initialize before Maven so CodeQL can trace Java compilation.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript, java-kotlin
      - name: Test and build React
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Test and package Java
        run: ./backend/mvnw -f backend/pom.xml -B -ntp verify
      # - name: Test release promotion rules
      #   run: python3 -m unittest discover -s tests -v
      - name: Analyze React and Java with CodeQL
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          output: ${{ runner.temp }}/codeql-results
      - name: Block high and critical security findings
        env:
          CODEQL_RESULTS: ${{ runner.temp }}/codeql-results
        run: |
          python3 -m unittest discover -s tests -p test_codeql.py -v
          python3 scripts/check_codeql.py "$CODEQL_RESULTS"
      - name: Package the main-branch release
        if: github.event_name == 'push'
        env:
          RELEASE_ID: ${{ github.sha }}
        run: python3 scripts/package.py --release "$RELEASE_ID" --output release.tar.gz
      - name: Store the release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish AWS release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: aws-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download the tested release
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ github.sha }}
          path: .download
      - name: Authenticate for ECR publication
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: release-${{ github.run_id }}
      - name: Build missing images once, publish and verify digests
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          python3 scripts/publish_aws_release.py \
            --archive .download/release.tar.gz --output aws-release.json \
            --account "$AWS_ACCOUNT_ID" --region "$AWS_REGION" \
            --release "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
      - name: Store AWS release metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: aws-release-${{ github.sha }}
          path: aws-release.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - name: Summarize stored images
        run: |
          python3 - <<'PY'
          import json, os
          release = json.load(open('aws-release.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Release `{release['release']}` is stored in ECR.\n\n")
              for service, image in release['images'].items():
                  summary.write(f"- {service}: `{image['uri']}`\n")
              summary.write('\nDownload **aws-release.json** from this run’s AWS release artifact.\n')
          PY
